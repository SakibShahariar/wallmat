<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b6cff"/>
      <stop offset="0.55" stop-color="#7b5cf0"/>
      <stop offset="1" stop-color="#a855d4"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8ecff"/>
    </linearGradient>
    <clipPath id="frontClip">
      <rect x="34" y="30" width="60" height="68" rx="9"/>
    </clipPath>
  </defs>

  <!-- App tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#tile)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="27.25"
        fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Stacked wallpapers behind -->
  <g transform="rotate(-11 64 64)">
    <rect x="38" y="28" width="58" height="70" rx="9"
          fill="#ffffff" fill-opacity="0.28"/>
  </g>
  <g transform="rotate(9 64 64)">
    <rect x="32" y="28" width="58" height="70" rx="9"
          fill="#ffffff" fill-opacity="0.45"/>
  </g>

  <!-- Front wallpaper card -->
  <rect x="34" y="30" width="60" height="68" rx="9" fill="url(#card)"/>
  <g clip-path="url(#frontClip)">
    <rect x="34" y="30" width="60" height="68" fill="#cfe0ff"/>
    <circle cx="76" cy="47" r="7" fill="#ffcf6b"/>
    <path d="M34 82 L52 60 L64 73 L76 56 L94 78 L94 98 L34 98 Z" fill="#4d8f7a"/>
    <path d="M34 88 L50 76 L62 86 L78 72 L94 88 L94 98 L34 98 Z" fill="#356b5c" fill-opacity="0.85"/>
  </g>
  <rect x="34.75" y="30.75" width="58.5" height="66.5" rx="8.25"
        fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1.5"/>
</svg>
